<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
   <style>
    /* Global Reset & Theme */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: #ffffff;
        color: #262626;
        height: 100vh;
        overflow: hidden;
    }

    .main-container {
        display: flex;
        height: 100vh;
    }

    /* Sidebar */
    .sidebar {
        width: 280px;
        background: #fcfcfc;
        border-right: 1px solid #e5e5e5;
        padding: 24px;
        display: flex;
        flex-direction: column;
    }

    /* Changed Sidebar H3 to Black */
    .sidebar h3 {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        color: #000000; 
        margin-bottom: 20px;
        border-bottom: 1px solid #e5e5e5;
        padding-bottom: 10px;
    }

    #documents { flex: 1; overflow-y: auto; }

    .history-item {
        background: #ffffff;
        padding: 10px;
        border: 1px solid #e5e5e5;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 14px;
        color: #404040;
    }

    .clear-btn {
        background: #ffffff;
        border: 1px solid #e5e5e5;
        color: #b91c1c;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 15px;
        width: 100%;
        font-size: 13px;
        font-weight: 500;
    }

    .clear-btn:hover { background: #fef2f2; }

    /* Main Chat Area */
    .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
    }

    .header {
        padding: 20px 40px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Changed Header H2 to Black */
    .header h2 {
        font-family: 'Georgia', serif;
        font-size: 22px;
        color: #000000;
    }

    /* Changed Guest marker text to Black */
    #guest-marker {
        color: #000000 !important;
    }

    .nav-btn {
        padding: 8px 16px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        background: #ffffff;
        color: #171717;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
    }

    /* Chat Bubbles */
    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 40px;
    }

    .user {
        background: #f4f4f4;
        color: #171717;
        padding: 12px 20px;
        border-radius: 16px;
        margin: 10px 0;
        text-align: right;
        max-width: 60%;
        margin-left: auto;
    }

    .bot {
        color: #262626;
        padding: 12px 0;
        line-height: 1.7;
        margin: 10px 0;
        max-width: 80%;
    }

    /* Input Area */
    form {
        padding: 20px 40px;
        background: #ffffff;
        display: flex;
        gap: 12px;
        border-top: 1px solid #f0f0f0;
    }

    input[type="text"] {
        flex: 1;
        padding: 16px;
        border: 1px solid #d4d4d4;
        border-radius: 10px;
        background: #ffffff;
        font-size: 16px;
        color: #171717;
    }

    button[type="submit"] {
        background: #171717;
        color: #ffffff;
        padding: 0 24px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
    }

    button[type="button"] {
        background: #f4f4f4;
        border: 1px solid #d4d4d4;
        padding: 0 20px;
        border-radius: 10px;
        cursor: pointer;
        color: #171717;
    }
</style>
</head>

<body>

    <div class="main-container">

        <div class="sidebar">
            <h3>Uploaded PDFs</h3>
            <div id="documents"></div>
            <button class="clear-btn" onclick="clearChatHistory()">🗑️ Clear History</button>
        </div>

        <div class="container">
            <div class="header">
                <h2>AI Assistant</h2>
                <div class="auth-buttons">
                    {% if session.get("user_id") %}
                    <span style="margin-right:15px;">Welcome <b>{{ session["username"] }}</b></span>
                    <a href="/logout"><button class="nav-btn">Logout</button></a>
                    {% else %}
                    <span id="guest-marker" style="margin-right:15px; color:#ae7878;">Browsing as <b>Guest</b></span>
                    <a href="/login"><button class="nav-btn">Login</button></a>
                    <a href="/register"><button class="nav-btn">Sign Up</button></a>
                    {% endif %}
                </div>
            </div>

            <div class="chat-box" id="chat-box">
                {% for chat in chat_history %}
                <div class="user">{{ chat.question }}</div>
                <div class="bot">{{ chat.answer }}</div>
                {% endfor %}
            </div>

            <input type="file" id="pdf-upload" hidden accept=".pdf" onchange="uploadFile()">

            <form onsubmit="sendMessage(event)">
                <input id="message" type="text" placeholder="Ask anything about your documents..." required>
                <button type="button" onclick="document.getElementById('pdf-upload').click()">+</button>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadDocuments();
            const chatBox = document.getElementById("chat-box");
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // 🎯 FIXED: Direct structural function to identify if current session is logged out
        function isGuestSession() {
            return document.getElementById("guest-marker") !== null;
        }

        /* UPLOAD PDF FILE */
        async function uploadFile() {
            if (isGuestSession()) {
                alert("Please log in to upload files to your account.");
                return;
            }

            const fileInput = document.getElementById("pdf-upload");
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("pdf", file);

            try {
                const response = await fetch("/upload", { method: "POST", body: formData });
                const result = await response.text();
                alert(result);
                loadDocuments();
            } catch (error) {
                alert("PDF Upload Failed");
            }
        }

        /* FETCH & RENDER SAVED DOCUMENTS */
        async function loadDocuments() {
            const container = document.getElementById("documents");

            // 🎯 FIX: Instantly empty old visual history entries out before running the fetch loop
            container.innerHTML = "";

            // Privacy intercept barrier. Wipes sidebar instantly if logged out!
            if (isGuestSession()) {
                container.innerHTML = '<div style="color: #666; font-size: 14px;">No files uploaded yet.</div>';
                return;
            }

            try {
                const response = await fetch("/documents");
                const docs = await response.json();

                if (docs.length === 0) {
                    container.innerHTML = '<div style="color: #666; font-size: 14px;">No files uploaded yet.</div>';
                    return;
                }

                docs.forEach(doc => {
                    container.innerHTML += `<div class="history-item">📄 ${doc.filename}</div>`;
                });
            } catch (err) {
                console.error("Failed to load documents", err);
            }
        }

        /* CLEAR USER CONVERSATION HISTORY */
        /* CLEAR USER CONVERSATION HISTORY */
        async function clearChatHistory() {
            if (isGuestSession()) {
                document.getElementById("chat-box").innerHTML = "";
                return;
            }

            if (!confirm("Are you sure you want to clear your chat history and files?")) return;
            try {
                const response = await fetch("/clear_history", { method: "POST" });
                if (response.ok) {
                    document.getElementById("chat-box").innerHTML = "";
                    // 🎯 ADD THIS: Refresh the sidebar list instantly
                    loadDocuments();
                } else {
                    alert("Failed to delete history.");
                }
            } catch (err) {
                console.error("Error deleting history:", err);
            }
        }



        /* HANDLE STREAM CHAT INPUT */
        async function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById("message");
            const message = input.value;
            if (message.trim() === "") return;

            const chatBox = document.getElementById("chat-box");

            const userDiv = document.createElement("div");
            userDiv.className = "user";
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);

            const botDiv = document.createElement("div");
            botDiv.className = "bot";
            botDiv.textContent = "Thinking...";
            chatBox.appendChild(botDiv);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`/stream?message=${encodeURIComponent(message)}`);
                if (!response.ok) throw new Error("Connection failed.");

                botDiv.textContent = "";
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    botDiv.textContent += decoder.decode(value);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (error) {
                botDiv.textContent = "An error occurred. Please try again.";
            }
        }
    </script>
</body>

</html>
