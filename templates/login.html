<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Assistant</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #171717;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-family: 'Georgia', serif;
            margin-bottom: 24px;
            text-align: center;
            color: #000;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d4d4d4;
            border-radius: 8px;
            font-size: 16px;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #171717;
        }

        button {
            background: #171717;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        p {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #737373;
        }

        a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Login</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
    <p>Don't have an account? <a href="/register">Sign up</a></p>
</div>

</body>
</html>
